<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(this)"><div id="toast" class="toast"></div>
<script>


const KEY='sari_pos_v2';
const DEFAULT_USERS=[{id:1,username:'admin',password:'admin123',name:'Store Admin',role:'admin',active:true},{id:2,username:'maria',password:'maria123',name:'Maria',role:'cashier',active:true},{id:3,username:'juan',password:'juan123',name:'Juan',role:'cashier',active:true}];
const seed={store:{name:"My Sari-Sari Store",address:"Philippines",phone:"",footer:"Thank you! Come again.",theme:{primary:'#7c3aed',primary2:'#5b21b6',accent:'#f97316',mode:'light',density:'comfortable',nav:'auto'},printer:{mode:'system',paper:'58mm',autoPrint:false,deviceName:''},gcash:{name:'',number:'',qr:''}},users:DEFAULT_USERS,products:[
{id:1,sku:'SKU-001',barcode:'4800888110011',name:'Coke 330ml',cat:'Drinks',buy:18,sell:25,stock:40,reorder:10},{id:2,sku:'SKU-002',barcode:'4800016110022',name:'Lucky Me Pancit Canton',cat:'Snacks',buy:12,sell:18,stock:35,reorder:8},{id:3,sku:'SKU-003',barcode:'4800016110033',name:'Nova Crackers',cat:'Snacks',buy:7,sell:10,stock:28,reorder:8},{id:4,sku:'SKU-004',barcode:'4800016110044',name:'Sardines',cat:'Grocery',buy:25,sell:32,stock:18,reorder:5},{id:5,sku:'SKU-005',barcode:'4800016110055',name:'Safeguard Soap',cat:'Grocery',buy:22,sell:28,stock:12,reorder:4},{id:6,sku:'SKU-006',barcode:'4800016110066',name:'Pepsi 330ml',cat:'Drinks',buy:16,sell:23,stock:22,reorder:8}],sales:[],expenses:[],invoice:1000};
let db=load(); if(!db.users) db.users=structuredClone(DEFAULT_USERS); db.products=(db.products||[]).map((p,i)=>({...p,barcode:p.barcode||''})); if(!db.store) db.store=structuredClone(seed.store); if(!db.store.theme) db.store.theme=structuredClone(seed.store.theme); if(!db.store.printer) db.store.printer=structuredClone(seed.store.printer); if(db.store.printer.mode==null) db.store.printer.mode='system'; if(db.store.printer.paper==null) db.store.printer.paper='58mm'; if(db.store.printer.autoPrint==null) db.store.printer.autoPrint=false; if(!db.store.printer.deviceName) db.store.printer.deviceName=''; if(!db.store.gcash) db.store.gcash={name:'',number:'',qr:''}; if(db.store.gcash.name==null) db.store.gcash.name=''; if(db.store.gcash.number==null) db.store.gcash.number=''; if(db.store.gcash.qr==null) db.store.gcash.qr=''; db.sales=(db.sales||[]).map(s=>({...s,reference:s.reference||''})); let sessionUser=null; let cart=[]; let currentPage='dashboard'; let posCat='All'; let paymentMethod='Cash'; let gcashReference=''; let blePrinter={device:null,characteristic:null}; const SESSION_KEY='sari_pos_session_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateStr(ts=Date.now()){return new Date(ts).toLocaleString('en-PH')}
function hexToRgb(hex){let h=String(hex||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);if(!Number.isFinite(n))return [124,58,237];return [(n>>16)&255,(n>>8)&255,n&255]}
function shadeHex(hex,delta){const [r,g,b]=hexToRgb(hex);const f=n=>Math.max(0,Math.min(255,n+delta));return '#'+[f(r),f(g),f(b)].map(n=>n.toString(16).padStart(2,'0')).join('')}
function applyTheme(){const t=db.store?.theme||{};const root=document.documentElement;const primary=t.primary||'#7c3aed',primary2=t.primary2||'#5b21b6',accent=t.accent||'#f97316';root.style.setProperty('--primary',primary);root.style.setProperty('--primary2',primary2);root.style.setProperty('--accent',accent);const [r,g,b]=hexToRgb(primary);root.style.setProperty('--primary-rgb',`${r},${g},${b}`);root.dataset.theme=t.mode==='dark'?'dark':'light';root.dataset.density=t.density||'comfortable';root.dataset.nav=t.nav||'auto'}
function setThemePreset(name){const presets={purple:{primary:'#7c3aed',primary2:'#5b21b6',accent:'#f97316'},blue:{primary:'#2563eb',primary2:'#1d4ed8',accent:'#06b6d4'},green:{primary:'#059669',primary2:'#047857',accent:'#84cc16'},orange:{primary:'#ea580c',primary2:'#c2410c',accent:'#f59e0b'},rose:{primary:'#e11d48',primary2:'#be123c',accent:'#f472b6'}};const preset=presets[name];if(!preset)return toast('Theme not found');db.store.theme={...db.store.theme,...preset};save();applyTheme();render();toast(`${name.charAt(0).toUpperCase()+name.slice(1)} theme applied`)}
applyTheme();
// Basic UI anti-inspect deterrents. These are deterrents only, not true source-code security.
document.addEventListener('contextmenu',e=>{e.preventDefault();toast('Right-click is disabled on this POS')},{capture:true});
document.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if(e.key==='F12' || (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k)) || (e.ctrlKey&&k==='u')){e.preventDefault();e.stopPropagation();toast('Developer shortcuts are disabled on this POS');return false;}
});
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}
function login(){
 const u=document.getElementById('loginUser').value.trim().toLowerCase(), p=document.getElementById('loginPass').value;
 const acct=db.users.find(x=>x.username.toLowerCase()===u&&x.password===p&&x.active!==false);
 if(!acct)return toast('Invalid username or password');
 sessionUser={id:acct.id,username:acct.username,name:acct.name,role:acct.role};
 localStorage.setItem(SESSION_KEY,JSON.stringify({id:acct.id}));
 currentPage=acct.role==='admin'?'dashboard':'pos';
 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 render();
}
function restoreSession(){
 try{
  const raw=localStorage.getItem(SESSION_KEY);
  if(!raw)return false;
  const saved=JSON.parse(raw);
  const acct=db.users.find(x=>x.id===saved.id&&x.active!==false);
  if(!acct){localStorage.removeItem(SESSION_KEY);return false;}
  sessionUser={id:acct.id,username:acct.username,name:acct.name,role:acct.role};
  currentPage=acct.role==='admin'?'dashboard':'pos';
  document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  return true;
 }catch(e){localStorage.removeItem(SESSION_KEY);return false}
}
function logout(){localStorage.removeItem(SESSION_KEY);sessionUser=null;cart=[];location.reload()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(b.dataset.role&&b.dataset.role!==sessionUser.role)return toast('Admin access only');currentPage=b.dataset.page;render()});
function render(){
 if(!sessionUser)return;
 applyTheme();
 const allowed=sessionUser.role==='admin'?['dashboard','pos','inventory','reports','transactions','settings']:['pos'];
 if(!allowed.includes(currentPage)) currentPage='pos';
 document.getElementById('pageTitle').textContent=({dashboard:'Dashboard',pos:'POS / Cashier',inventory:'Inventory',reports:'Reports',transactions:'Transactions',settings:'Settings'})[currentPage];
 document.getElementById('pageSub').textContent=({dashboard:'Sales, inventory, and store overview',pos:'Touch-friendly checkout screen',inventory:'Products, stock-in, and low-stock control',reports:'Sales, profit, and best-selling analysis',transactions:'Invoice and payment history',settings:'Store, users, and system settings'})[currentPage];
 document.getElementById('userBadge').innerHTML=`<b>${sessionUser.name}</b><br>${sessionUser.role==='admin'?'ADMINISTRATOR':'CASHIER'}`;
 document.getElementById('topUser').textContent=`Logged in: ${sessionUser.name}`;
 document.querySelectorAll('.nav button').forEach(b=>{const r=b.dataset.role;b.style.display=(!r||r===sessionUser.role)?'block':'none';b.classList.toggle('active',b.dataset.page===currentPage)});
 const fn={dashboard:dashboard,pos:pos,inventory:inventory,reports:reports,transactions:transactions,settings:settings}[currentPage];
 document.getElementById('content').innerHTML=fn();
 if(currentPage==='dashboard')drawChart();
}
function dashboard(){
 const today=new Date().toDateString();
 const tx=db.sales.filter(s=>new Date(s.ts).toDateString()===today);
 const sales=tx.reduce((a,b)=>a+b.total,0);
 const cash=tx.filter(s=>s.method==='Cash').reduce((a,b)=>a+b.total,0);
 const gcash=tx.filter(s=>s.method==='GCash').reduce((a,b)=>a+b.total,0);
 const profit=tx.reduce((a,b)=>a+b.profit,0);
 const items=tx.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);
 const low=db.products.filter(p=>p.stock<=p.reorder).length;
 return `<div class="grid kpis">
  <div class="card kpi"><div class="label">TODAY SALES</div><div class="value">${money(sales)}</div><div class="sub">${tx.length} transaction(s)</div></div>
  <div class="card kpi"><div class="label">💵 CASH SALES</div><div class="value">${money(cash)}</div><div class="sub">Cash payments today</div></div>
  <div class="card kpi" style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-top:4px solid #16a34a"><div class="label" style="color:#166534">📱 GCASH SALES</div><div class="value" style="color:#15803d">${money(gcash)}</div><div class="sub" style="color:#166534">GCash payments today</div></div>
  <div class="card kpi"><div class="label">GROSS PROFIT</div><div class="value">${money(profit)}</div><div class="sub">Based on item cost</div></div>
  <div class="card kpi"><div class="label">LOW STOCK</div><div class="value">${low}</div><div class="sub">Needs attention</div></div>
 </div>
 <div class="grid" style="grid-template-columns:1.5fr 1fr;margin-top:14px">
  <div class="card"><div style="font-weight:800">Sales – Last 7 Days</div><div class="chart" id="chart"></div>
   <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
    <div class="card" style="box-shadow:none;background:#f8fafc"><div class="label">ITEMS SOLD TODAY</div><div class="value" style="font-size:22px">${items}</div></div>
    <div class="card" style="box-shadow:none;background:#f8fafc"><div class="label">TODAY'S SALES</div><div class="value" style="font-size:22px">${money(sales)}</div></div>
   </div>
  </div>
  <div class="card"><div style="font-weight:800;margin-bottom:10px">Today's Payment Breakdown</div>
   <div class="sumrow"><span>Cash</span><b>${money(cash)}</b></div>
   <div class="sumrow"><span>GCash</span><b>${money(gcash)}</b></div>
   <div class="sumrow" style="border-top:1px dashed var(--line);padding-top:9px"><span><b>Total Sales</b></span><b>${money(sales)}</b></div>
   <div style="font-weight:800;margin:14px 0 10px">Low Stock Alert</div>
   ${db.products.filter(p=>p.stock<=p.reorder).slice(0,8).map(p=>`<div class="sumrow"><span>${p.name}</span><b class="low">${p.stock}</b></div>`).join('')||'<div class="empty">All stock levels are healthy.</div>'}
  </div>
 </div>`
}
function drawChart(){let el=document.getElementById('chart');if(!el)return;let vals=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let v=db.sales.filter(s=>new Date(s.ts).toDateString()===d.toDateString()).reduce((a,b)=>a+b.total,0);vals.push({d:d.toLocaleDateString('en-PH',{weekday:'short'}),v})}let max=Math.max(1,...vals.map(x=>x.v));el.innerHTML=vals.map(x=>`<div class="bar" style="height:${Math.max(5,x.v/max*180)}px"><b>${x.v?money(x.v):''}</b><span>${x.d}</span></div>`).join('')}
function pos(){let cats=['All',...new Set(db.products.map(p=>p.cat))];let products=db.products.filter(p=>posCat==='All'||p.cat===posCat);return `<div class="grid layout2"><div class="card"><div class="scan-wrap"><input class="search scan-input" id="barcodeScan" placeholder="▣ Scan / enter barcode" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();scanBarcodeInput()}"><button class="btn primary" onclick="startCameraScanner()">📷 Scan</button></div><div class="toolbar"><input class="search" id="posSearch" placeholder="🔎 Search product / SKU / barcode" oninput="refreshProducts()"><button class="btn success" onclick="clearCart()">Clear Cart</button></div><div class="chips">${cats.map(c=>`<button class="chip ${c===posCat?'active':''}" onclick="posCat='${c}';render()">${c}</button>`).join('')}</div><div class="grid products" id="productGrid" style="margin-top:12px">${products.map(productCard).join('')}</div></div><div class="card cart"><div class="cart-head"><div style="font-weight:850">🛒 Current Order</div><span class="badge b-good">${cart.length} line(s)</span></div><div id="cartBox">${cartHtml()}</div></div></div>`}
function productCard(p){let cc=(String(p.cat||'Other').toLowerCase().replace(/[^a-z0-9]+/g,'-'));return `<button class="prod cat-${cc}" onclick="addCart(${p.id})" ${p.stock<=0?'disabled':''}><div><div style="display:inline-block;padding:4px 8px;border-radius:999px;background:#f5f3ff;color:#6d28d9;font-size:10px;font-weight:800;margin-bottom:8px">${p.cat}</div><div class="name">${p.name}</div><div class="sub">${p.sku}</div></div><div><div class="price">${money(p.sell)}</div><div class="stock ${p.stock<=p.reorder?'low':''}">${p.stock<=0?'OUT OF STOCK':'Stock: '+p.stock}</div></div></button>`}
function refreshProducts(){let q=((document.getElementById('posSearch') ? document.getElementById('posSearch').value : '')||'').toLowerCase();let el=document.getElementById('productGrid');if(el)el.innerHTML=db.products.filter(p=>(posCat==='All'||p.cat===posCat)&&(`${p.name} ${p.sku} ${p.barcode||''}`.toLowerCase().includes(q))).map(productCard).join('')}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return;let x=cart.find(i=>i.id===id);if(x){if(x.qty<p.stock)x.qty++;}else cart.push({id:p.id,name:p.name,price:p.sell,buy:p.buy,qty:1});document.getElementById('cartBox').innerHTML=cartHtml();const c=document.querySelector('.cart');if(c){c.classList.remove('cart-pop');void c.offsetWidth;c.classList.add('cart-pop');}}
function normalizeBarcode(v){return String(v||'').trim().replace(/\s+/g,'')}
function scanBarcodeInput(){const el=document.getElementById('barcodeScan');const code=normalizeBarcode(el?.value);if(!code)return;scanBarcode(code);if(el){el.value='';setTimeout(()=>el.focus(),60)}}
function scanBarcode(code){const value=normalizeBarcode(code);const p=db.products.find(x=>normalizeBarcode(x.barcode)===value);if(!p)return toast('Barcode not found: '+value);if(p.stock<=0)return toast(p.name+' is out of stock');addCart(p.id);toast(p.name+' added to cart')}
let scannerStream=null,scannerTimer=null,scannerDetector=null;
async function startCameraScanner(){if(!('mediaDevices' in navigator)&&!navigator.mediaDevices){return toast('Camera access is not available on this device')}openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">📷 Barcode Scanner</div><button class="btn" onclick="stopCameraScanner();closeModal()">✕</button></div><div class="scanner-box"><video id="barcodeVideo" playsinline muted></video><div id="scannerStatus" class="scanner-status">Starting camera…</div></div><div class="notice" style="margin-top:10px">Point the camera at a product barcode. A supported browser may need camera permission and HTTPS/localhost.</div>`);try{if(!('BarcodeDetector' in window)){document.getElementById('scannerStatus').textContent='Camera opened, but this browser does not support BarcodeDetector. Use a Bluetooth/USB barcode scanner instead.';return}scannerDetector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf']});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const video=document.getElementById('barcodeVideo');video.srcObject=scannerStream;await video.play();document.getElementById('scannerStatus').textContent='Scanning…';const loop=async()=>{if(!scannerDetector||!video||video.readyState<2){scannerTimer=requestAnimationFrame(loop);return}try{const codes=await scannerDetector.detect(video);if(codes&&codes.length){const raw=codes[0].rawValue;stopCameraScanner();closeModal();scanBarcode(raw);return}}catch(e){}scannerTimer=requestAnimationFrame(loop)};scannerTimer=requestAnimationFrame(loop)}catch(e){document.getElementById('scannerStatus').textContent='Unable to start camera. Check browser permission.';stopCameraScanner()}}
function stopCameraScanner(){if(scannerTimer)cancelAnimationFrame(scannerTimer);scannerTimer=null;scannerDetector=null;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}}
function cartHtml(){if(!cart.length)return '<div class="empty">No items yet.<br>Add products to start a sale.</div>';let subtotal=cart.reduce((a,i)=>a+i.price*i.qty,0);let gc= db.store.gcash||{};let qr=gc.qr||'';return `<div class="cart-items">${cart.map((i,idx)=>`<div class="cart-row"><div class="cart-top"><div><b>${i.name}</b><div class="sub">${money(i.price)} each</div></div><b>${money(i.price*i.qty)}</b></div><div class="qty"><button class="qbtn" onclick="chgQty(${idx},-1)">−</button><b>${i.qty}</b><button class="qbtn" onclick="chgQty(${idx},1)">+</button><button class="qbtn" style="margin-left:auto" onclick="cart.splice(${idx},1);document.getElementById('cartBox').innerHTML=cartHtml();updatePaymentUI()">🗑</button></div></div>`).join('')}</div><div class="summary"><div class="sumrow"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="sumrow"><span>Discount</span><b>₱0.00</b></div><div class="sumrow grand"><span>TOTAL</span><span>${money(subtotal)}</span></div><div class="paybox"><div class="field"><label>${paymentMethod==='GCash'?'GCash Amount':'Payment'}</label><input id="pay" type="number" step="0.01" placeholder="0.00" oninput="updateChange()"></div><div class="field"><label>Change</label><input id="change" readonly value="₱0.00"></div><div class="field full"><label>Payment Method</label><select id="method" onchange="togglePaymentMethod(this.value)"><option value="Cash" ${paymentMethod==='Cash'?'selected':''}>Cash</option><option value="GCash" ${paymentMethod==='GCash'?'selected':''}>GCash</option></select></div></div><div id="gcashPayBox" class="gcash-card" style="display:${paymentMethod==='GCash'?'block':'none'}"><div class="gcash-inline"><div>${qr?`<img class="gcash-qr" src="${qr}" alt="GCash QR Code">`:`<div class="gcash-empty-qr" aria-label="GCash QR placeholder"></div>`}</div><div><b style="font-size:15px">📱 GCash Payment</b><div class="sub" style="margin-top:4px">Customer scans the QR and sends <b>${money(subtotal)}</b>.</div><div class="sub" style="margin-top:4px">${gc.name?`Account: <b>${gc.name}</b><br>`:''}${gc.number?`GCash: <b>${gc.number}</b>`:'Set your GCash account/QR in Settings.'}</div><button class="btn primary" style="margin-top:9px" onclick="showGcashQr(${subtotal})">🔳 Show GCash QR</button></div></div><div class="field" style="margin-top:10px"><label>GCash Reference Number <span style="color:#dc2626">*</span></label><input id="gcashRef" class="gcash-ref" value="${String(gcashReference||'').replace(/"/g,'&quot;')}" placeholder="Enter customer GCash reference" oninput="gcashReference=this.value"></div></div><button class="btn primary" style="width:100%;margin-top:12px;font-size:16px;padding:13px" onclick="checkout()">✓ COMPLETE SALE</button></div>`}
function chgQty(idx,delta){let i=cart[idx],p=db.products.find(x=>x.id===i.id);i.qty=Math.max(1,Math.min(p.stock,i.qty+delta));document.getElementById('cartBox').innerHTML=cartHtml()}
function updateChange(){let total=cart.reduce((a,i)=>a+i.price*i.qty,0),pay=Number((document.getElementById('pay') ? document.getElementById('pay').value : '')||0);let c=document.getElementById('change');if(c)c.value=money(paymentMethod==='GCash'?0:Math.max(0,pay-total))}
function togglePaymentMethod(method){paymentMethod=method==='GCash'?'GCash':'Cash';gcashReference=paymentMethod==='GCash'?(document.getElementById('gcashRef')?.value||gcashReference):'';const box=document.getElementById('gcashPayBox');if(box)box.style.display=paymentMethod==='GCash'?'block':'none';const label=document.querySelector('#pay')?.previousElementSibling;if(label)label.textContent=paymentMethod==='GCash'?'GCash Amount':'Payment';updateChange()}
function updatePaymentUI(){const sel=document.getElementById('method');if(sel)sel.value=paymentMethod;togglePaymentMethod(paymentMethod);const ref=document.getElementById('gcashRef');if(ref){ref.value=gcashReference;ref.focus();ref.setSelectionRange(ref.value.length,ref.value.length)}}
function clearCart(){cart=[];paymentMethod='Cash';gcashReference='';render()}
function showGcashQr(amount){const gc=db.store.gcash||{},qr=gc.qr||'';openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">📱 Pay with GCash</div><button class="btn" onclick="closeModal()">✕</button></div><div style="text-align:center"><div class="sub">Customer: scan this QR and send</div><div style="font-size:28px;font-weight:950;margin:4px 0 12px">${money(amount)}</div>${qr?`<img src="${qr}" alt="GCash QR Code" style="width:min(320px,80vw);height:min(320px,80vw);object-fit:contain;border:8px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:18px">`:`<div class="gcash-empty-qr" style="width:220px;height:220px;margin:0 auto"></div><div class="notice" style="margin:12px auto;max-width:420px">No official GCash QR has been uploaded yet. Admin can upload it in <b>Settings → GCash Payment</b>.</div>`}<div style="margin-top:12px;font-weight:800">${gc.name||'GCash Account'}${gc.number?` · ${gc.number}`:''}</div><div class="sub" style="margin-top:5px">After the customer pays, enter the GCash reference number in the POS.</div></div>`)}
function checkout(){if(sessionUser.role!=='cashier'&&sessionUser.role!=='admin')return toast('Unauthorized');if(!cart.length)return toast('Cart is empty');let total=cart.reduce((a,i)=>a+i.price*i.qty,0),pay=Number((document.getElementById('pay') ? document.getElementById('pay').value : '')||0),method=paymentMethod||'Cash',reference=String(document.getElementById('gcashRef')?.value||gcashReference||'').trim();if(pay<total)return toast('Payment is not enough');if(method==='GCash'&&pay!==total)return toast('GCash payment should match the exact total');if(method==='GCash'&&reference.length<4)return toast('Enter the GCash reference number');for(const i of cart){const p=db.products.find(x=>x.id===i.id);if(!p||p.stock<i.qty)return toast(`Insufficient stock: ${i.name}`)}let items=cart.map(i=>({id:i.id,name:i.name,price:i.price,buy:i.buy,qty:i.qty}));items.forEach(i=>{let p=db.products.find(x=>x.id===i.id);p.stock-=i.qty});let profit=items.reduce((a,i)=>a+(i.price-i.buy)*i.qty,0);let sale={invoice:'INV-'+String(db.invoice++).padStart(6,'0'),ts:Date.now(),items,total,payment:pay,change:method==='GCash'?0:pay-total,method,reference:method==='GCash'?reference:'',profit,cashierId:sessionUser.id,cashier:sessionUser.name};db.sales.unshift(sale);save();showReceipt(sale);cart=[];paymentMethod='Cash';gcashReference=''}
function printerStatus(){const p=db.store.printer||{};if(p.mode==='ble')return blePrinter.characteristic?'🟢 BLE Connected':'🟠 BLE Not Connected';return p.deviceName?`🟢 ${p.deviceName}`:'⚪ System Printer';}
function showReceipt(s){openModal(`<div class="receipt"><h3>${db.store.name}</h3><div style="text-align:center;font-size:12px">${db.store.address}<br>${db.store.phone||''}</div><div class="rhr"></div><div class="rline"><span>Invoice</span><span>${s.invoice}</span></div><div class="rline"><span>Date</span><span>${dateStr(s.ts)}</span></div><div class="rline"><span>Cashier</span><span>${s.cashier||'Admin'}</span></div><div class="rhr"></div>${s.items.map(i=>`<div class="rline"><span>${i.qty}x ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="rhr"></div><div class="rline"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="rline"><span>${s.method}</span><span>${money(s.payment)}</span></div>${s.method==='GCash'?`<div class="rline"><span>GCash Ref</span><span>${s.reference||'—'}</span></div>`:''}<div class="rline"><span>Change</span><span>${money(s.change)}</span></div><div class="rhr"></div><div style="text-align:center">${db.store.footer}</div><div class="notice" style="margin-top:12px;text-align:center">Printer: <b>${printerStatus()}</b></div></div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" style="flex:1" onclick="printReceipt('${s.invoice}')">🖨 Print / Bluetooth</button><button class="btn" onclick="closeModal();render()">Close</button></div>`);if(db.store.printer?.autoPrint)setTimeout(()=>printReceipt(s.invoice),180)}
async function printReceipt(inv){let s=db.sales.find(x=>x.invoice===inv);if(!s)return;if(db.store.printer?.mode==='ble'&&blePrinter.characteristic){try{await blePrintReceipt(s);toast('Receipt sent to Bluetooth printer');return}catch(e){toast('Bluetooth print failed; opening system print');}}systemPrintReceipt(s)}
function systemPrintReceipt(s){let paper=db.store.printer?.paper==='80mm'?'80mm':'58mm';let w=window.open('','_blank','width=420,height=700');if(!w)return toast('Popup blocked. Allow popups for printing.');w.document.write(`<html><head><title>${s.invoice}</title><style>@page{size:${paper} auto;margin:0}body{font-family:monospace;padding:8px;width:${paper};box-sizing:border-box;margin:0;font-size:12px}.r{width:100%;margin:auto}.x{display:flex;justify-content:space-between;gap:8px}.hr{border-top:1px dashed #000;margin:8px 0;text-align:center}.center{text-align:center}.total{font-size:16px;font-weight:800}</style></head><body><div class="r"><div class="center"><h3 style="margin:0">${db.store.name}</h3><div>${db.store.address}</div>${db.store.phone?`<div>${db.store.phone}</div>`:''}</div><div class="hr"></div><div class="x"><span>Invoice</span><span>${s.invoice}</span></div><div class="x"><span>Date</span><span>${dateStr(s.ts)}</span></div><div class="x"><span>Cashier</span><span>${s.cashier||'Admin'}</span></div><div class="hr"></div>${s.items.map(i=>`<div class="x"><span>${i.qty}x ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div class="hr"></div><div class="x total"><span>TOTAL</span><span>${money(s.total)}</span></div><div class="x"><span>${s.method}</span><span>${money(s.payment)}</span></div>${s.method==='GCash'?`<div class="x"><span>GCash Ref</span><span>${s.reference||'—'}</span></div>`:''}<div class="x"><span>Change</span><span>${money(s.change)}</span></div><div class="hr"></div><div class="center">${db.store.footer}</div></div><script>window.print();setTimeout(()=>window.close(),700)<\/script></body></html>`);w.document.close()}
const ESC=0x1B,GS=0x1D;
async function bleWrite(data){const c=blePrinter.characteristic;if(!c)throw new Error('Not connected');const bytes=data instanceof Uint8Array?data:new Uint8Array(data);const chunk=180;for(let i=0;i<bytes.length;i+=chunk){const part=bytes.slice(i,i+chunk);if(c.properties?.writeWithoutResponse&&c.writeValueWithoutResponse)await c.writeValueWithoutResponse(part);else await c.writeValue(part);}}
async function findWritableCharacteristic(server){const common=['0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e'];for(const uuid of common){try{const svc=await server.getPrimaryService(uuid);for(const ch of await svc.getCharacteristics())if(ch.properties?.write||ch.properties?.writeWithoutResponse)return ch;}catch(e){}}for(const svc of await server.getPrimaryServices()){for(const ch of await svc.getCharacteristics())if(ch.properties?.write||ch.properties?.writeWithoutResponse)return ch;}throw new Error('No writable BLE characteristic found');}
async function connectBluetoothPrinter(){if(!navigator.bluetooth)return toast('Web Bluetooth is not supported in this browser. Use a paired system printer instead.');try{const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ffe0-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb','6e400001-b5a3-f393-e0a9-e50e24dcca9e']});if(!device.gatt)throw new Error('Bluetooth GATT unavailable');const server=await device.gatt.connect();const ch=await findWritableCharacteristic(server);blePrinter={device,characteristic:ch};db.store.printer.mode='ble';db.store.printer.deviceName=device.name||'Bluetooth Thermal Printer';save();render();toast('Bluetooth printer connected');}catch(e){toast('Bluetooth connection cancelled or unavailable');}}
function disconnectBluetoothPrinter(){try{blePrinter.device?.gatt?.disconnect()}catch(e){}blePrinter={device:null,characteristic:null};db.store.printer.mode='system';db.store.printer.deviceName='';save();render();toast('Bluetooth printer disconnected')}
async function blePrintReceipt(s){const te=new TextEncoder();let out=[];const push=(str)=>out.push(te.encode(str));out.push(new Uint8Array([ESC,0x40]));out.push(new Uint8Array([ESC,0x61,0x01]));out.push(new Uint8Array([ESC,0x45,0x01]));push((db.store.name||'Sari-Sari Store')+'\n');out.push(new Uint8Array([ESC,0x45,0x00]));push((db.store.address||'')+'\n');push('Invoice: '+s.invoice+'\n');push(dateStr(s.ts)+'\n');push('Cashier: '+(s.cashier||'Admin')+'\n');push('--------------------------------\n');out.push(new Uint8Array([ESC,0x61,0x00]));for(const i of s.items){let line=`${i.qty}x ${i.name}`;let amount=Number(i.price*i.qty).toFixed(2);let space=Math.max(1,30-line.length-amount.length);push(line+' '.repeat(space)+amount+'\n')}push('--------------------------------\n');out.push(new Uint8Array([ESC,0x45,0x01]));push('TOTAL'.padEnd(20)+' '+Number(s.total).toFixed(2)+'\n');out.push(new Uint8Array([ESC,0x45,0x00]));push((s.method||'Cash')+' '.repeat(Math.max(1,20-(s.method||'Cash').length))+Number(s.payment).toFixed(2)+'\n');if(s.method==='GCash')push('GCash Ref'.padEnd(20)+' '+(s.reference||'—')+'\n');push('Change'.padEnd(20)+' '+Number(s.change).toFixed(2)+'\n');push('--------------------------------\n');out.push(new Uint8Array([ESC,0x61,0x01]));push((db.store.footer||'Thank you! Come again.')+'\n\n\n');out.push(new Uint8Array([GS,0x56,0x00]));await bleWrite(joinBytes(out));}
function testBluetoothPrinter(){if(!blePrinter.characteristic)return toast('Connect a BLE printer first');const te=new TextEncoder();bleWrite(new Uint8Array([...te.encode('SARI POS\nBluetooth printer test\n------------------------------\nOK\n\n')]));toast('Test receipt sent')}
function inventory(){return `<div class="card"><div class="toolbar"><input class="search" placeholder="🔎 Search inventory" oninput="filterInv(this.value)"><button class="btn primary" onclick="openProduct()">+ Add Product</button></div><div class="table-wrap"><table class="table" id="invTable"><thead><tr><th>SKU</th><th>Barcode</th><th>Product</th><th>Category</th><th>Buy</th><th>Sell</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.products.map(productRow).join('')}</tbody></table></div></div>`}
function productRow(p){let st=p.stock<=0?'<span class="badge b-out">OUT</span>':p.stock<=p.reorder?'<span class="badge b-low">LOW</span>':'<span class="badge b-good">OK</span>';return `<tr><td>${p.sku}</td><td><span class="barcode-text">${p.barcode||'—'}</span></td><td><b>${p.name}</b></td><td>${p.cat}</td><td>${money(p.buy)}</td><td>${money(p.sell)}</td><td>${p.stock}</td><td>${st}</td><td><button class="btn" onclick="openProduct(${p.id})">Edit</button> <button class="btn warn" onclick="stockIn(${p.id})">+ Stock</button> <button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`}
function filterInv(q){q=q.toLowerCase();document.querySelectorAll('#invTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
function openProduct(id){let p=id?db.products.find(x=>x.id===id):{id:null,sku:'SKU-'+String(Date.now()).slice(-4),barcode:'',name:'',cat:'Grocery',buy:0,sell:0,stock:0,reorder:5};openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">${id?'Edit Product':'Add Product'}</div><button class="btn" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>SKU</label><input id="fsku" value="${p.sku}"></div><div class="field"><label>Barcode</label><input id="fbarcode" value="${p.barcode||''}" inputmode="numeric" autocomplete="off" placeholder="Scan or type barcode"></div><div class="field"><label>Product Name</label><input id="fname" value="${p.name}"></div><div class="field"><label>Category</label><input id="fcat" value="${p.cat}"></div><div class="field"><label>Buy Price</label><input id="fbuy" type="number" step="0.01" value="${p.buy}"></div><div class="field"><label>Selling Price</label><input id="fsell" type="number" step="0.01" value="${p.sell}"></div><div class="field"><label>Current Stock</label><input id="fstock" type="number" value="${p.stock}"></div><div class="field"><label>Reorder Level</label><input id="freorder" type="number" value="${p.reorder}"></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveProduct(${id||'null'})">Save Product</button>`)}
function saveProduct(id){let productId=id||Date.now();let barcode=normalizeBarcode(document.getElementById('fbarcode')?.value||'');let duplicate=barcode&&db.products.some(x=>x.id!==productId&&normalizeBarcode(x.barcode)===barcode);if(duplicate)return toast('Barcode already assigned to another product');let o={id:productId,sku:fsku.value.trim(),barcode,name:fname.value.trim(),cat:fcat.value.trim()||'Other',buy:Number(fbuy.value),sell:Number(fsell.value),stock:Number(fstock.value),reorder:Number(freorder.value)};if(!o.name)return toast('Enter product name');let ix=db.products.findIndex(x=>x.id===o.id);if(ix>=0)db.products[ix]=o;else db.products.push(o);save();closeModal();render();toast('Product saved')}
function stockIn(id){const p=db.products.find(x=>x.id===id);if(!p)return toast('Product not found');openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">Stock In — ${p.name}</div><button class="btn" onclick="closeModal()">✕</button></div><div class="notice">Current stock: <b>${p.stock}</b></div><div class="field"><label>Quantity to Add</label><input id="stockQty" type="number" min="1" step="1" value="1" autofocus></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addStock(${id})">Add Stock</button>`)}
function addStock(id){if(!sessionUser||sessionUser.role!=='admin')return toast('Admin access only');const p=db.products.find(x=>x.id===id);if(!p)return toast('Product not found');const qty=Math.floor(Number(document.getElementById('stockQty')?.value||0));if(!Number.isFinite(qty)||qty<1)return toast('Enter a valid stock quantity');p.stock=Number(p.stock||0)+qty;save();closeModal();render();toast(`${qty} stock added to ${p.name}`)}
function deleteProduct(id){if(!sessionUser||sessionUser.role!=='admin')return toast('Admin access only');const p=db.products.find(x=>x.id===id);if(!p)return toast('Product not found');if(!confirm(`Delete ${p.name} from Inventory?\n\nPast sales will remain in Transactions/Reports.`))return;db.products=db.products.filter(x=>x.id!==id);cart=cart.filter(x=>x.id!==id);save();render();toast(`${p.name} deleted from Inventory`)}
function reports(){let total=db.sales.reduce((a,s)=>a+s.total,0),profit=db.sales.reduce((a,s)=>a+s.profit,0),units=db.sales.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0);let cm={};db.sales.forEach(s=>{let n=s.cashier||'Admin';cm[n]=cm[n]||{sales:0,tx:0,profit:0};cm[n].sales+=s.total;cm[n].profit+=s.profit;cm[n].tx++});return `<div class="grid kpis"><div class="card kpi"><div class="label">ALL-TIME SALES</div><div class="value">${money(total)}</div></div><div class="card kpi"><div class="label">EST. GROSS PROFIT</div><div class="value">${money(profit)}</div></div><div class="card kpi"><div class="label">UNITS SOLD</div><div class="value">${units}</div></div><div class="card kpi"><div class="label">PRODUCTS</div><div class="value">${db.products.length}</div></div></div><div class="card" style="margin-top:14px"><div style="font-weight:850;margin-bottom:12px">Sales by Cashier</div>${Object.entries(cm).sort((a,b)=>b[1].sales-a[1].sales).map(([n,v])=>`<div class="sumrow"><span><b>${n}</b><br><span class="sub">${v.tx} transaction(s) · Profit ${money(v.profit)}</span></span><b>${money(v.sales)}</b></div>`).join('')||'<div class="empty">No cashier sales yet.</div>'}</div><div class="card" style="margin-top:14px"><div style="font-weight:850">📊 Report Export</div><div class="sub" style="margin:5px 0 10px">Download your sales, transactions, items sold, inventory, and cashier summaries as an Excel workbook.</div><div class="toolbar"><button class="btn primary excel-btn" onclick="exportExcel()">📊 Export Reports to Excel</button></div></div><div class="card" style="margin-top:14px;border-color:#fed7aa;background:#fffaf5"><div style="font-weight:850;color:#9a3412">🧪 Test Tool — Reset Sales</div><div class="sub" style="margin:5px 0 10px">Clears all completed sales and invoice history on this device and resets the invoice counter. Inventory is not restored.</div><button class="btn danger" onclick="resetTestSales()">🗑 Reset Test Sales</button></div>`}
function transactions(){return `<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Method</th><th>Reference</th><th>Cashier</th><th>Profit</th><th></th></tr></thead><tbody>${db.sales.map(s=>`<tr><td><b>${s.invoice}</b></td><td>${dateStr(s.ts)}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(s.total)}</td><td>${money(s.payment)}</td><td>${s.method}</td><td>${s.reference||'—'}</td><td>${s.cashier||'Admin'}</td><td>${money(s.profit)}</td><td><button class="btn" onclick="showReceipt(db.sales.find(x=>x.invoice==='${s.invoice}'))">View</button></td></tr>`).join('')||'<tr><td colspan="10"><div class="empty">No transactions yet.</div></td></tr>'}</tbody></table></div></div>`}
function settings(){const t=db.store.theme||{},p=db.store.printer||{};return `<div class="card"><div style="font-weight:850;margin-bottom:12px">Store Information</div><div class="formgrid"><div class="field"><label>Store Name</label><input id="sname" value="${db.store.name}"></div><div class="field"><label>Phone</label><input id="sphone" value="${db.store.phone}"></div><div class="field full"><label>Address</label><input id="saddr" value="${db.store.address}"></div><div class="field full"><label>Receipt Footer</label><input id="sfooter" value="${db.store.footer}"></div></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Save Store Settings</button></div><div class="card settings-theme-card" style="margin-top:14px"><div style="font-weight:850">🎨 Theme & Display</div><div class="sub" style="margin:5px 0 14px">Change the POS colors, dark/light appearance, interface density, and navigation behavior. Settings are saved locally on this device.</div><div class="theme-presets"><button class="theme-swatch purple" onclick="setThemePreset('purple')">Purple</button><button class="theme-swatch blue" onclick="setThemePreset('blue')">Blue</button><button class="theme-swatch green" onclick="setThemePreset('green')">Green</button><button class="theme-swatch orange" onclick="setThemePreset('orange')">Orange</button><button class="theme-swatch rose" onclick="setThemePreset('rose')">Rose</button></div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Primary Color</label><input id="themePrimary" type="color" value="${t.primary||'#7c3aed'}" onchange="updateThemeColor()"></div><div class="field"><label>Appearance</label><select id="themeMode" onchange="updateDisplaySettings()"><option value="light" ${t.mode!=='dark'?'selected':''}>☀️ Light</option><option value="dark" ${t.mode==='dark'?'selected':''}>🌙 Dark</option></select></div><div class="field"><label>Interface Density</label><select id="themeDensity" onchange="updateDisplaySettings()"><option value="compact" ${t.density==='compact'?'selected':''}>Compact</option><option value="comfortable" ${t.density!=='compact'&&t.density!=='spacious'?'selected':''}>Comfortable</option><option value="spacious" ${t.density==='spacious'?'selected':''}>Spacious / Touch</option></select></div><div class="field"><label>Navigation</label><select id="themeNav" onchange="updateDisplaySettings()"><option value="auto" ${t.nav!=='compact'?'selected':''}>Auto by screen</option><option value="compact" ${t.nav==='compact'?'selected':''}>Compact sidebar</option></select></div></div><div class="notice" style="margin-top:12px">Tip: <b>Spacious / Touch</b> is useful for tablets and touchscreen cashier devices. The layout automatically adapts for phones, tablets, laptops, and large monitors.</div></div><div class="card" style="margin-top:14px"><div style="font-weight:850">📱 GCash Payment</div><div class="sub" style="margin:5px 0 12px">Upload your official GCash QR screenshot so the cashier can show it to customers during payment. Everything stays local on this device.</div><div class="formgrid"><div class="field"><label>GCash Account Name</label><input id="gname" value="${(db.store.gcash?.name||'').replace(/"/g,'&quot;')}" placeholder="e.g. Store Name"></div><div class="field"><label>GCash Number</label><input id="gnumber" value="${(db.store.gcash?.number||'').replace(/"/g,'&quot;')}" placeholder="09XXXXXXXXX" inputmode="numeric"></div><div class="field full"><label>Official GCash QR Image</label><input id="gcashQrFile" type="file" accept="image/*" onchange="handleGcashQrUpload(this)"></div></div><div class="gcash-inline" style="margin-top:12px"><div>${db.store.gcash?.qr?`<img class="gcash-qr" src="${db.store.gcash.qr}" alt="GCash QR Preview">`:`<div class="gcash-empty-qr"></div>`}</div><div><b>${db.store.gcash?.qr?'QR uploaded':'No QR uploaded'}</b><div class="sub" style="margin-top:5px">The uploaded image will appear in the cashier's GCash payment panel and customer QR view.</div><div class="toolbar" style="margin-top:9px"><button class="btn primary" onclick="saveGcashSettings()">Save GCash Settings</button>${db.store.gcash?.qr?`<button class="btn danger" onclick="removeGcashQr()">Remove QR</button>`:''}</div></div></div></div></div><div class="card" style="margin-top:14px"><div style="font-weight:850">🖨 Receipt Printer</div><div class="sub" style="margin:5px 0 12px">Pair a Bluetooth thermal printer with the device, then use System Printer for the normal OS print dialog. Direct BLE mode is available for compatible BLE/GATT thermal printers.</div><div class="formgrid"><div class="field"><label>Printer Mode</label><select id="printerMode" onchange="updatePrinterSettings()"><option value="system" ${p.mode!=='ble'?'selected':''}>🖨 System / Paired Bluetooth Printer</option><option value="ble" ${p.mode==='ble'?'selected':''}>📡 Direct Bluetooth BLE Printer</option></select></div><div class="field"><label>Receipt Paper</label><select id="printerPaper" onchange="updatePrinterSettings()"><option value="58mm" ${p.paper!=='80mm'?'selected':''}>58 mm</option><option value="80mm" ${p.paper==='80mm'?'selected':''}>80 mm</option></select></div><div class="field"><label>Auto Print after Sale</label><select id="printerAuto" onchange="updatePrinterSettings()"><option value="off" ${!p.autoPrint?'selected':''}>Off</option><option value="on" ${p.autoPrint?'selected':''}>On</option></select></div><div class="field"><label>Current Printer</label><input value="${printerStatus()}" readonly></div></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="connectBluetoothPrinter()">📡 Connect Bluetooth</button><button class="btn" onclick="testBluetoothPrinter()">🧾 Test Print</button><button class="btn danger" onclick="disconnectBluetoothPrinter()">Disconnect</button></div><div class="notice" style="margin-top:10px">For ordinary Bluetooth Classic thermal printers, pair the printer in Windows/Android Bluetooth settings and choose <b>System / Paired Bluetooth Printer</b>. Direct BLE works only on printers that expose a writable Bluetooth GATT service. Web Bluetooth usually requires <b>HTTPS or localhost</b>; it may not work when opening the HTML directly with <code>file://</code>.</div></div><div class="card" style="margin-top:14px"><div style="font-weight:850">🔐 My Account / Password</div><div class="sub" style="margin:5px 0 10px">Change the password for your currently signed-in ${sessionUser.role==='admin'?'admin':'cashier'} account.</div><button class="btn primary" onclick="changePasswordModal()">Change My Password</button></div><div class="card" style="margin-top:14px"><div style="font-weight:850">Cashier / User Accounts</div><div class="sub" style="margin:5px 0 10px">Create separate accounts so every sale is tagged to the person who made it.</div><button class="btn primary" onclick="openUser()">+ Add Cashier</button><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.username}</td><td>${u.role.toUpperCase()}</td><td>${u.active!==false?'<span class="badge b-good">ACTIVE</span>':'<span class="badge b-out">DISABLED</span>'}</td><td>${u.id===sessionUser.id?'<span class="sub">Current account</span>':`<button class="btn ${u.active!==false?'danger':'success'}" onclick="toggleUser(${u.id})">${u.active!==false?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:14px"><div style="font-weight:850">Data Tools</div><div class="sub" style="margin:5px 0 10px">Offline backup and Excel reporting tools. Passwords are never included in Excel exports.</div><div class="toolbar" style="margin-top:10px"><button class="btn" onclick="exportData()">💾 JSON Backup</button><button class="btn" onclick="document.getElementById('restoreFile').click()">♻️ Restore Backup</button></div></div>`}
function updateThemeColor(){const p=document.getElementById('themePrimary')?.value||'#7c3aed';const [r,g,b]=hexToRgb(p);db.store.theme.primary=p;db.store.theme.primary2=shadeHex(p,-28);save();applyTheme();toast('Primary color updated')}
function updateDisplaySettings(){db.store.theme.mode=document.getElementById('themeMode')?.value||'light';db.store.theme.density=document.getElementById('themeDensity')?.value||'comfortable';db.store.theme.nav=document.getElementById('themeNav')?.value||'auto';save();applyTheme();render();toast('Display settings saved')}
function updatePrinterSettings(){db.store.printer.mode=document.getElementById('printerMode')?.value||'system';db.store.printer.paper=document.getElementById('printerPaper')?.value||'58mm';db.store.printer.autoPrint=document.getElementById('printerAuto')?.value==='on';save();render();toast('Printer settings saved')}
function changePasswordModal(){if(!sessionUser)return;openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">🔐 Change My Password</div><button class="btn" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field full"><label>Current Password</label><input id="oldPass" type="password" autocomplete="current-password"></div><div class="field"><label>New Password</label><input id="newPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirm New Password</label><input id="confirmPass" type="password" autocomplete="new-password"></div></div><div class="notice" style="margin-top:10px">Use at least 6 characters. The change is stored locally on this POS device.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="saveMyPassword()">Update Password</button>`)}
function saveMyPassword(){const oldP=document.getElementById('oldPass')?.value||'',newP=document.getElementById('newPass')?.value||'',confirmP=document.getElementById('confirmPass')?.value||'';const acct=db.users.find(u=>u.id===sessionUser.id);if(!acct)return toast('Account not found');if(acct.password!==oldP)return toast('Current password is incorrect');if(newP.length<6)return toast('New password must be at least 6 characters');if(newP!==confirmP)return toast('New passwords do not match');acct.password=newP;save();closeModal();toast('Password changed successfully')}
function saveSettings(){db.store.name=sname.value;db.store.phone=sphone.value;db.store.address=saddr.value;db.store.footer=sfooter.value;save();toast('Store settings saved');render()}
function saveGcashSettings(){if(!db.store.gcash)db.store.gcash={name:'',number:'',qr:''};db.store.gcash.name=(document.getElementById('gname')?.value||'').trim();db.store.gcash.number=(document.getElementById('gnumber')?.value||'').trim();save();render();toast('GCash settings saved')}
function handleGcashQrUpload(input){if(!db.store.gcash)db.store.gcash={name:'',number:'',qr:''};db.store.gcash.name=(document.getElementById('gname')?.value||db.store.gcash.name||'').trim();db.store.gcash.number=(document.getElementById('gnumber')?.value||db.store.gcash.number||'').trim();const file=input?.files?.[0];if(!file)return;if(file.size>4*1024*1024)return toast('QR image must be 4 MB or less');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=520,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);db.store.gcash.qr=canvas.toDataURL('image/jpeg',0.88);save();render();toast('GCash QR uploaded')};img.src=reader.result};reader.readAsDataURL(file)}
function removeGcashQr(){if(!confirm('Remove the saved GCash QR image from this device?'))return;db.store.gcash.qr='';save();render();toast('GCash QR removed')}
function resetTestSales(){if(!sessionUser||sessionUser.role!=='admin')return toast('Admin access only');if(!db.sales.length)return toast('No sales to reset');if(!confirm('Reset all sales and invoice history on this device?\n\nInventory will NOT be restored.'))return;db.sales=[];db.invoice=1000;save();render();toast('Test sales reset') }
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sari-sari-pos-backup.json';a.click();URL.revokeObjectURL(a.href);toast('JSON backup downloaded')}
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function xCell(v){if(typeof v==='number'&&isFinite(v))return `<c><v>${v}</v></c>`;return `<c t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`}
function xRow(vals){return `<row>${vals.map(xCell).join('')}</row>`}
function makeSheet(name,headers,rows){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${xRow(headers)}${rows.map(xRow).join('')}</sheetData></worksheet>`}
function crc32(bytes){let table=crc32.table;if(!table){table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0}crc32.table=table}let c=0xFFFFFFFF;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function u16(n){const a=new Uint8Array(2);new DataView(a.buffer).setUint16(0,n,true);return a}
function u32(n){const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,n>>>0,true);return a}
function joinBytes(arrs){let len=arrs.reduce((n,a)=>n+a.length,0),out=new Uint8Array(len),o=0;for(const a of arrs){out.set(a,o);o+=a.length}return out}
function zipStore(files){const enc=new TextEncoder(),local=[],central=[];let offset=0;const now=new Date();const dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();const dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|Math.floor(now.getSeconds()/2);for(const [name,textVal] of files){const nameB=enc.encode(name),data=enc.encode(textVal),crc=crc32(data);const lh=joinBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),nameB,data]);local.push(lh);const ch=joinBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nameB]);central.push(ch);offset+=lh.length}const cd=joinBytes(central),end=joinBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(offset),u16(0)]);return joinBytes([...local,cd,end])}
function exportExcel(){
 if(!sessionUser || sessionUser.role!=='admin')return toast('Admin access only');
 const txRows=db.sales.map(function(s){return [s.invoice,dateStr(s.ts),s.cashier||'Admin',s.method,s.reference||'',s.total,s.payment,s.change,s.profit]});
 const itemRows=[];
 db.sales.forEach(function(s){s.items.forEach(function(i){itemRows.push([s.invoice,dateStr(s.ts),s.cashier||'Admin',i.id,i.name,i.qty,i.price,i.buy,i.price*i.qty,(i.price-i.buy)*i.qty])})});
 const invRows=db.products.map(function(p){return [p.sku,p.name,p.cat,p.buy,p.sell,p.stock,p.reorder,p.buy*p.stock,p.sell*p.stock,(p.sell-p.buy)*p.stock]});
 const todaySales=db.sales.filter(function(s){return new Date(s.ts).toDateString()===new Date().toDateString()});
 const summaryRows=[
  ['Store',db.store.name],
  ['Generated',dateStr()],
  ['Today Sales',todaySales.reduce(function(a,s){return a+s.total},0)],
  ['Today Profit',todaySales.reduce(function(a,s){return a+s.profit},0)],
  ['Today Transactions',todaySales.length],
  ['All-Time Sales',db.sales.reduce(function(a,s){return a+s.total},0)],
  ['All-Time Profit',db.sales.reduce(function(a,s){return a+s.profit},0)],
  ['Products',db.products.length],
  ['Units in Stock',db.products.reduce(function(a,p){return a+p.stock},0)]
 ];
 const cm={};
 db.sales.forEach(function(s){const n=s.cashier||'Admin';if(!cm[n])cm[n]={tx:0,sales:0,profit:0};cm[n].tx++;cm[n].sales+=s.total;cm[n].profit+=s.profit});
 const cashierRows=db.users.map(function(u){const c=cm[u.name]||{tx:0,sales:0,profit:0};return [u.name,u.username,u.role,u.active!==false?'Active':'Disabled',c.tx,c.sales,c.profit]});
 const overrides=[];for(let i=1;i<=5;i++)overrides.push('<Override PartName="/xl/worksheets/sheet'+i+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
 const rels=[];for(let i=1;i<=5;i++)rels.push('<Relationship Id="rId'+i+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+i+'.xml"/>');
 const sheets=[];sheets.push('<sheet name="Summary" sheetId="1" r:id="rId1"/>','<sheet name="Transactions" sheetId="2" r:id="rId2"/>','<sheet name="Items Sold" sheetId="3" r:id="rId3"/>','<sheet name="Inventory" sheetId="4" r:id="rId4"/>','<sheet name="Cashiers" sheetId="5" r:id="rId5"/>');
 const files=[
  ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+overrides.join('')+'</Types>'],
  ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
  ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.join('')+'</sheets></workbook>'],
  ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.join('')+'</Relationships>'],
  ['xl/worksheets/sheet1.xml',makeSheet('Summary',['Metric','Value'],summaryRows)],
  ['xl/worksheets/sheet2.xml',makeSheet('Transactions',['Invoice','Date','Cashier','Payment Method','Reference','Total','Payment','Change','Profit'],txRows)],
  ['xl/worksheets/sheet3.xml',makeSheet('Items Sold',['Invoice','Date','Cashier','Product ID','Product','Qty','Unit Price','Buy Price','Line Total','Line Profit'],itemRows)],
  ['xl/worksheets/sheet4.xml',makeSheet('Inventory',['SKU','Product','Category','Buy Price','Selling Price','Stock','Reorder Level','Stock Cost Value','Retail Value','Potential Profit'],invRows)],
  ['xl/worksheets/sheet5.xml',makeSheet('Cashiers',['Name','Username','Role','Status','Transactions','Sales','Profit'],cashierRows)]
 ];
 const bytes=zipStore(files),blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='sari-sari-pos-report-'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();URL.revokeObjectURL(a.href);toast('Excel report downloaded')
}
function restoreData(input){const f=(input.files && input.files[0]);if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||!Array.isArray(obj.products)||!Array.isArray(obj.sales)||!Array.isArray(obj.users))throw new Error('Invalid backup');if(!confirm('Restore this POS backup? Current browser data will be replaced.'))return;db=obj;save();cart=[];toast('Backup restored');setTimeout(()=>location.reload(),450)}catch(e){toast('Invalid backup file')}};r.readAsText(f);input.value=''}
function openUser(){openModal(`<div class="modal-head"><div style="font-size:20px;font-weight:850">Add Cashier Account</div><button class="btn" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>Full Name</label><input id="uname"></div><div class="field"><label>Username</label><input id="uuser"></div><div class="field"><label>Password</label><input id="upass" type="password"></div><div class="field"><label>Role</label><select id="urole"><option value="cashier">Cashier</option><option value="admin">Admin</option></select></div></div><div class="notice" style="margin-top:10px">Cashiers can access POS only. Admin accounts can manage inventory, reports, transactions, settings, and users.</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveUser()">Create Account</button>`)}
function saveUser(){let name=uname.value.trim(),username=uuser.value.trim().toLowerCase(),password=upass.value,role=urole.value;if(!name||!username||!password)return toast('Complete all fields');if(db.users.some(u=>u.username===username))return toast('Username already exists');db.users.push({id:Date.now(),name,username,password,role,active:true});save();closeModal();render();toast('User account created')}
function toggleUser(id){if(sessionUser.role!=='admin')return;let u=db.users.find(x=>x.id===id);if(!u)return;if(u.id===sessionUser.id)return toast('Cannot disable the account currently in use');u.active=u.active===false;save();render();toast(u.active?'User enabled':'User disabled')}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
restoreSession();
if(sessionUser) render();


</script>
</body></html>
